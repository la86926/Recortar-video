<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>Recorte — editor de video</title>
<style>
html,body{margin:0;min-height:100%;background:#F5F5F7;color:#1D1D1F;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.boot-card{max-width:360px;padding:24px;border-radius:22px;background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.08)}
.boot-dot{width:34px;height:34px;margin:0 auto 14px;border:4px solid rgba(31,191,91,.18);border-top-color:#1FBF5B;border-radius:50%;animation:spin .8s linear infinite}
.boot p{margin:0;color:#636366;font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-color-scheme:dark){html,body{background:#090A09;color:#F5F5F7}.boot-card{background:#1C1E1B}.boot p{color:#A1A1A6}}
</style>
</head>
<body>
<div class="boot"><div class="boot-card"><div class="boot-dot"></div><p>Abriendo el editor…</p></div></div>
<script>
(() => {
  'use strict';

  const BASE_SOURCES = [
    'https://raw.githubusercontent.com/la86926/Recortar-video/811e0e7ac0f1d038dce39bcb327f562814fd5731/index.html',
    'https://cdn.jsdelivr.net/gh/la86926/Recortar-video@811e0e7ac0f1d038dce39bcb327f562814fd5731/index.html'
  ];

  const oldLockButton = `        <button class="icon-btn" id="cropLock" type="button" aria-pressed="false" aria-label="Confirmar encuadre" title="Confirmar encuadre">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="m8 12 3 3 5-6"/></svg>
        </button>`;
  const newLockButton = `        <button class="icon-btn crop-lock-control" id="cropLock" type="button" aria-pressed="false" aria-label="Confirmar recorte" title="Confirmar recorte">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="m8 12 3 3 5-6"/></svg>
          <span class="crop-lock-label">Confirmar recorte</span>
        </button>`;

  const oldNotice = `function showEditNotice(message,type=''){
  clearTimeout(S.toastTimer);
  els.editNotice.textContent=message;
  els.editNotice.className='edit-toast show'+(type?' '+type:'');
  S.toastTimer=setTimeout(()=>{ els.editNotice.className='edit-toast'; },2600);
}`;
  const newNotice = `function showEditNotice(){
  // Avisos flotantes desactivados para mantener la pantalla despejada.
}`;

  const oldCropLock = `function setCropLocked(locked){
  S.cropLocked=!!locked;
  S.drag=null; S.stageTap=null; markHandle(null);
  els.stage.classList.toggle('crop-locked',S.cropLocked);
  els.cropLock.setAttribute('aria-pressed',String(S.cropLocked));
  const label=S.cropLocked?'Editar encuadre':'Confirmar encuadre';
  els.cropLock.setAttribute('aria-label',label);
  els.cropLock.title=label;
}`;
  const newCropLock = `function setCropLocked(locked){
  S.cropLocked=!!locked;
  S.drag=null; S.stageTap=null; markHandle(null);
  els.stage.classList.toggle('crop-locked',S.cropLocked);
  els.cropLock.setAttribute('aria-pressed',String(S.cropLocked));
  const label=S.cropLocked?'Editar recorte':'Confirmar recorte';
  const visibleLabel=els.cropLock.querySelector('.crop-lock-label');
  if(visibleLabel) visibleLabel.textContent=S.cropLocked?'Recorte bloqueado':'Confirmar recorte';
  els.cropLock.setAttribute('aria-label',label);
  els.cropLock.title=label;
}`;

  const cssOverride = `/* Mejoras solicitadas: eliminar visible, bloqueo claro y pantalla sin avisos flotantes */
.edit-toast{display:none !important}
.editor-toolbar .danger-tool{
  background:#FFFFFF !important;
  color:#E23D3D !important;
  border-color:rgba(226,61,61,.24) !important;
}
html[data-theme="dark"] .editor-toolbar .danger-tool{
  background:#252823 !important;
  color:#FF6961 !important;
  border-color:rgba(255,105,97,.28) !important;
}
.stage-toolbar{
  display:grid;
  grid-template-columns:minmax(0,1fr) 48px;
  align-items:center;
  gap:8px;
}
.stage-toolbar .chips{
  grid-column:1/-1;
  width:100%;
  min-width:0;
  margin:0;
  padding:2px 3px 7px;
}
.stage-toolbar .crop-lock-control{
  grid-column:1;
  width:100%;
  min-width:0;
  min-height:46px;
  padding:0 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:var(--brand-soft);
  color:var(--ink);
  border-color:var(--brand-line);
  animation:crop-lock-attention 1.8s ease-in-out infinite;
}
.stage-toolbar .crop-lock-control svg{width:21px;height:21px;flex:0 0 auto}
.stage-toolbar .crop-lock-label{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font:700 13.5px var(--sans);
}
.stage-toolbar #floatPreviewToggle{grid-column:2;width:48px}
#cropLock[aria-pressed="true"]{
  animation:none;
  border-color:transparent;
  background:var(--action);
  color:#FFFFFF;
  box-shadow:0 3px 10px rgba(31,191,91,.20);
}
html[data-theme="dark"] .stage-toolbar .crop-lock-control[aria-pressed="false"]{
  background:rgba(31,191,91,.14);
  color:#8EE5AD;
}
@keyframes crop-lock-attention{
  0%,100%{box-shadow:0 0 0 0 rgba(31,191,91,.08)}
  50%{box-shadow:0 0 0 5px rgba(31,191,91,.16)}
}

`;

  function replaceExactlyOnce(source, oldValue, newValue, label) {
    const first = source.indexOf(oldValue);
    const last = source.lastIndexOf(oldValue);
    if (first < 0 || first !== last) throw new Error('No se pudo actualizar: ' + label);
    return source.slice(0, first) + newValue + source.slice(first + oldValue.length);
  }

  function applyRequestedChanges(html) {
    html = replaceExactlyOnce(html, oldLockButton, newLockButton, 'control del recorte');
    html = replaceExactlyOnce(html, oldNotice, newNotice, 'avisos flotantes');
    html = replaceExactlyOnce(html, oldCropLock, newCropLock, 'estado del recorte');
    html = replaceExactlyOnce(html, '@media (max-width:430px){', cssOverride + '@media (max-width:430px){', 'estilos');
    return html;
  }

  async function fetchBase() {
    let lastError;
    for (const source of BASE_SOURCES) {
      try {
        const response = await fetch(source, {cache:'force-cache'});
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return await response.text();
      } catch (error) {
        lastError = error;
      }
    }
    throw lastError || new Error('No se pudo cargar el editor.');
  }

  fetchBase()
    .then(applyRequestedChanges)
    .then(html => {
      document.open();
      document.write(html);
      document.close();
    })
    .catch(error => {
      console.error(error);
      document.querySelector('.boot-card').innerHTML = '<p>No se pudo abrir el editor. Recarga la página cuando tengas conexión.</p>';
    });
})();
</script>
</body>
</html>
