<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>Recorte — editor de video</title>
<style>
html,body{margin:0;min-height:100%;background:#F5F5F7;color:#1D1D1F;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.boot-card{max-width:360px;padding:24px;border-radius:22px;background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.08)}
.boot-dot{width:34px;height:34px;margin:0 auto 14px;border:4px solid rgba(31,191,91,.18);border-top-color:#1FBF5B;border-radius:50%;animation:spin .8s linear infinite}
.boot p{margin:0;color:#636366;font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-color-scheme:dark){html,body{background:#090A09;color:#F5F5F7}.boot-card{background:#1C1E1B}.boot p{color:#A1A1A6}}
</style>
</head>
<body>
<div class="boot"><div class="boot-card"><div class="boot-dot"></div><p>Abriendo el editor…</p></div></div>
<script>
(() => {
  'use strict';

  const BASE_SOURCES = [
    'https://raw.githubusercontent.com/la86926/Recortar-video/513adda8511b3d75888f9b49fc5c62c2df22dd81/index.html',
    'https://cdn.jsdelivr.net/gh/la86926/Recortar-video@513adda8511b3d75888f9b49fc5c62c2df22dd81/index.html'
  ];

  const oldLockButton = `        <button class="icon-btn" id="cropLock" type="button" aria-pressed="false" aria-label="Confirmar encuadre" title="Confirmar encuadre">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="m8 12 3 3 5-6"/></svg>
        </button>`;
  const newLockButton = `        <button class="icon-btn crop-lock-control" id="cropLock" type="button" aria-pressed="false" aria-label="Bloquear recorte" title="Bloquear recorte">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="m8 12 3 3 5-6"/></svg>
          <span class="crop-lock-label">Bloquear recorte</span>
        </button>`;

  const oldNotice = `function showEditNotice(message,type=''){
  clearTimeout(S.toastTimer);
  els.editNotice.textContent=message;
  els.editNotice.className='edit-toast show'+(type?' '+type:'');
  S.toastTimer=setTimeout(()=>{ els.editNotice.className='edit-toast'; },2600);
}`;
  const newNotice = `function showEditNotice(){
  // Avisos flotantes desactivados para mantener la pantalla despejada.
}`;

  const oldCropLock = `function setCropLocked(locked){
  S.cropLocked=!!locked;
  S.drag=null; S.stageTap=null; markHandle(null);
  els.stage.classList.toggle('crop-locked',S.cropLocked);
  els.cropLock.setAttribute('aria-pressed',String(S.cropLocked));
  const label=S.cropLocked?'Editar encuadre':'Confirmar encuadre';
  els.cropLock.setAttribute('aria-label',label);
  els.cropLock.title=label;
}`;
  const newCropLock = `function setCropLocked(locked){
  S.cropLocked=!!locked;
  S.drag=null; S.stageTap=null; markHandle(null);
  els.stage.classList.toggle('crop-locked',S.cropLocked);
  els.cropLock.setAttribute('aria-pressed',String(S.cropLocked));
  const label=S.cropLocked?'Desbloquear recorte':'Bloquear recorte';
  const visibleLabel=els.cropLock.querySelector('.crop-lock-label');
  if(visibleLabel) visibleLabel.textContent=S.cropLocked?'Recorte bloqueado':'Bloquear recorte';
  els.cropLock.setAttribute('aria-label',label);
  els.cropLock.title=label;
}`;

  const oldExportState = `  exportState:null, exportGain:null, exportMonitorDisconnected:false, exportElementVolume:null,
  sourceCapture:null, projectName:'video', projectFormat:'mp4', gifImporting:false,`;
  const newExportState = `  exportState:null, exportGain:null, exportMonitorDisconnected:false, exportElementVolume:null,
  exportBufferAudio:null, sourceCapture:null, projectName:'video', projectFormat:'mp4', gifImporting:false,`;

  const oldExportFps = `  const fps=Math.max(1,Math.min(120,Math.max(...usedSources.map(s=>s.fps||30),1)));`;
  const newExportFps = `  const appleMobile=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const fps=Math.max(1,Math.min(appleMobile?30:60,Math.max(...usedSources.map(s=>s.fps||30),1)));`;

  const oldBitrate = `  const bitrate=Math.max(4000000,Math.min(300000000,Math.round(Math.max(sourceMatchedRate,nativeQualityFloor))));`;
  const newBitrate = `  const bitrate=Math.max(4000000,Math.min(appleMobile?24000000:120000000,Math.round(Math.max(sourceMatchedRate,nativeQualityFloor))));`;

  const oldAudioContext = `    const ctx=new AC();`;
  const newAudioContext = `    let ctx;
    try{ ctx=new AC({sampleRate:48000,latencyHint:'playback'}); }
    catch(e){ ctx=new AC(); }`;

  const oldClearAudio = `function clearExportAudioRouting(){
  if(S.exportGain&&S.audio){
    try{ S.audio.src.disconnect(S.exportGain); }catch(e){}
    try{ S.exportGain.disconnect(); }catch(e){}
  }
  S.exportGain=null; S.dest=null;
  if(S.sourceCapture){
    try{ S.sourceCapture.getTracks().forEach(t=>t.stop()); }catch(e){}
    S.sourceCapture=null;
  }
  restorePreviewAfterExport();
}`;
  const newClearAudio = `function clearExportAudioRouting(){
  if(S.exportGain&&S.audio){
    try{ S.audio.src.disconnect(S.exportGain); }catch(e){}
    try{ S.exportGain.disconnect(); }catch(e){}
  }
  S.exportGain=null; S.dest=null;
  if(S.sourceCapture){
    try{ S.sourceCapture.getTracks().forEach(t=>t.stop()); }catch(e){}
    S.sourceCapture=null;
  }
  if(S.exportBufferAudio){
    const b=S.exportBufferAudio;
    try{ if(b.started) b.node.stop(); }catch(e){}
    try{ b.node.disconnect(); }catch(e){}
    try{ b.gain.disconnect(); }catch(e){}
    try{ if(b.ctx&&b.ctx.state!=='closed') b.ctx.close(); }catch(e){}
    S.exportBufferAudio=null;
  }
  restorePreviewAfterExport();
}`;

  const oldAudioRouting = `  const stream=cvs.captureStream(fps);
  let dest=null, audioAdded=false;
  const a=ensureAudio();
  if(els.keepAudio.checked){
    if(a){
      try{
        dest=a.ctx.createMediaStreamDestination();
        S.exportGain=a.ctx.createGain();
        S.exportGain.gain.value=1.1;
        a.src.connect(S.exportGain); S.exportGain.connect(dest);
        const at=dest.stream.getAudioTracks()[0];
        if(at){ stream.addTrack(at); audioAdded=true; }
        if(a.ctx.state==='suspended') await a.ctx.resume();
      }catch(e){ dest=null; }
    }
    if(!audioAdded&&typeof v.captureStream==='function'){
      try{
        S.sourceCapture=v.captureStream();
        const at=S.sourceCapture.getAudioTracks()[0];
        if(at){ stream.addTrack(at); audioAdded=true; }
      }catch(e){ S.sourceCapture=null; }
    }
  }`;
  const newAudioRouting = `  const stream=cvs.captureStream(fps);
  const exportVideoTrack=stream.getVideoTracks()[0]||null;
  if(exportVideoTrack){ try{ exportVideoTrack.contentHint='motion'; }catch(e){} }

  let dest=null, audioAdded=false, directAudio=false, a=null;
  const simpleAudioPlan=plan.length===1&&!plan[0].reversed&&!(plan[0].fadeAudioIn||0)&&!(plan[0].fadeAudioOut||0);
  if(els.keepAudio.checked){
    // En navegadores compatibles se toma el audio directamente del mismo video.
    const captureMedia=v.captureStream||v.mozCaptureStream;
    if(simpleAudioPlan&&typeof captureMedia==='function'){
      try{
        S.sourceCapture=captureMedia.call(v);
        const at=S.sourceCapture.getAudioTracks()[0];
        if(at){ stream.addTrack(at); audioAdded=true; directAudio=true; }
      }catch(e){ S.sourceCapture=null; }
    }

    // Safari/iOS: decodificar el audio del archivo y arrancarlo con el primer fotograma realmente presentado.
    if(!audioAdded&&simpleAudioPlan){
      const clip=plan[0], source=sourceById(clip.sourceId);
      if(source&&source.file&&typeof source.file.arrayBuffer==='function'){
        let bctx=null;
        try{
          const BAC=window.AudioContext||window.webkitAudioContext;
          try{ bctx=new BAC({sampleRate:48000,latencyHint:'playback'}); }
          catch(e){ bctx=new BAC(); }
          const raw=await source.file.arrayBuffer();
          const decoded=await bctx.decodeAudioData(raw);
          dest=bctx.createMediaStreamDestination();
          const gain=bctx.createGain(); gain.gain.value=1.1; gain.connect(dest);
          const node=bctx.createBufferSource(); node.buffer=decoded; node.connect(gain);
          const at=dest.stream.getAudioTracks()[0];
          if(at){
            stream.addTrack(at); audioAdded=true;
            S.exportBufferAudio={ctx:bctx,node,gain,clip,started:false};
            if(bctx.state==='suspended') await bctx.resume();
          }else{
            try{ node.disconnect(); gain.disconnect(); bctx.close(); }catch(e){}
          }
        }catch(e){
          try{ if(bctx&&bctx.state!=='closed') bctx.close(); }catch(err){}
          S.exportBufferAudio=null; dest=null;
        }
      }
    }

    // Respaldo para proyectos complejos con fundidos, inversión o varios fragmentos.
    if(!audioAdded){
      a=ensureAudio();
      if(a){
        try{
          dest=a.ctx.createMediaStreamDestination();
          S.exportGain=a.ctx.createGain();
          S.exportGain.gain.value=1.1;
          a.src.connect(S.exportGain); S.exportGain.connect(dest);
          const at=dest.stream.getAudioTracks()[0];
          if(at){ stream.addTrack(at); audioAdded=true; }
          if(a.ctx.state==='suspended') await a.ctx.resume();
        }catch(e){ dest=null; }
      }
    }
  }`;

  const oldSilenceCall = `  silencePreviewForExport(a);`;
  const newSilenceCall = `  if(!directAudio) silencePreviewForExport(a);`;

  const oldRecorderOptions = `  const recorderOptions={videoBitsPerSecond:bitrate,audioBitsPerSecond:320000};`;
  const newRecorderOptions = `  const recorderOptions={videoBitsPerSecond:bitrate,audioBitsPerSecond:320000};
  try{ recorderOptions.audioBitrateMode='constant'; }catch(e){}`;

  const oldRecorderStart = `  rec.start(200);
  S.exportState.clipStartedAt=performance.now();
  if(!S.exportState.plan[0].reversed) await v.play().catch(()=>{});
  S.raf=requestAnimationFrame(exportTick);`;
  const newRecorderStart = `  await new Promise(resolve=>{
    let settled=false, timer=0;
    const ready=()=>{
      if(settled) return;
      settled=true;
      if(timer) clearTimeout(timer);
      resolve();
    };
    rec.addEventListener('start',ready,{once:true});
    rec.start();
    timer=setTimeout(ready,400);
  });
  if(!S.exporting||!S.exportState) return;
  drawComposite(S.exportState.ctx,S.exportState.output.w,S.exportState.output.h);
  S.exportState.clipStartedAt=performance.now();

  if(!S.exportState.plan[0].reversed){
    if(S.exportBufferAudio){
      let resolved=false;
      const firstFrame=new Promise(resolve=>{
        const done=mediaTime=>{
          if(resolved) return;
          resolved=true;
          resolve(Number.isFinite(mediaTime)?mediaTime:v.currentTime);
        };
        if(typeof v.requestVideoFrameCallback==='function'){
          try{ v.requestVideoFrameCallback((now,meta)=>done(meta&&meta.mediaTime)); }
          catch(e){}
        }
        v.addEventListener('playing',()=>setTimeout(()=>done(v.currentTime),0),{once:true});
        setTimeout(()=>done(v.currentTime),300);
      });
      const playPromise=v.play().catch(()=>{});
      const mediaTime=await firstFrame;
      if(!S.exporting||!S.exportState) return;
      drawComposite(S.exportState.ctx,S.exportState.output.w,S.exportState.output.h);
      const b=S.exportBufferAudio, clip=b.clip;
      const offset=Math.min(clip.end,Math.max(clip.start,mediaTime));
      const duration=Math.max(.001,clip.end-offset);
      try{
        b.node.start(b.ctx.currentTime,offset,duration);
        b.started=true;
      }catch(e){}
      await playPromise;
    }else{
      await v.play().catch(()=>{});
    }
  }
  S.raf=requestAnimationFrame(exportTick);`;

  const oldRecorderPause = `    let resumeRecorder=false;
    if(nextClip&&S.rec&&S.rec.state==='recording'){
      try{ S.rec.pause(); resumeRecorder=true; }catch(e){}
    }
    v.pause();`;
  const newRecorderPause = `    v.pause();`;

  const oldRecorderResume = `      if(resumeRecorder&&S.rec&&S.rec.state==='paused'){
        try{ S.rec.resume(); }catch(e){}
      }
`;
  const newRecorderResume = ``;

  const cssOverride = `/* Mejoras solicitadas: visor compacto, bloqueo claro y pantalla sin avisos flotantes */
.edit-toast{display:none !important}
.stage{
  width:min(82%,480px) !important;
  margin-left:auto !important;
  margin-right:auto !important;
}
.editor-toolbar .danger-tool{
  background:#FFFFFF !important;
  color:#E23D3D !important;
  border-color:rgba(226,61,61,.24) !important;
}
html[data-theme="dark"] .editor-toolbar .danger-tool{
  background:#252823 !important;
  color:#FF6961 !important;
  border-color:rgba(255,105,97,.28) !important;
}
.stage-toolbar{
  display:grid;
  grid-template-columns:minmax(0,1fr) 48px;
  align-items:center;
  gap:8px;
}
.stage-toolbar .chips{
  grid-column:1/-1;
  width:100%;
  min-width:0;
  margin:0;
  padding:2px 3px 7px;
}
.stage-toolbar .crop-lock-control{
  grid-column:1;
  width:100%;
  min-width:0;
  min-height:46px;
  padding:0 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:var(--brand-soft);
  color:var(--ink);
  border-color:var(--brand-line);
  animation:crop-lock-attention 1.8s ease-in-out infinite;
}
.stage-toolbar .crop-lock-control svg{width:21px;height:21px;flex:0 0 auto}
.stage-toolbar .crop-lock-label{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font:700 13.5px var(--sans);
}
.stage-toolbar #floatPreviewToggle{grid-column:2;width:48px}
#cropLock[aria-pressed="true"]{
  animation:none;
  border-color:transparent;
  background:var(--action);
  color:#FFFFFF;
  box-shadow:0 3px 10px rgba(31,191,91,.20);
}
html[data-theme="dark"] .stage-toolbar .crop-lock-control[aria-pressed="false"]{
  background:rgba(31,191,91,.14);
  color:#8EE5AD;
}
@keyframes crop-lock-attention{
  0%,100%{box-shadow:0 0 0 0 rgba(31,191,91,.08)}
  50%{box-shadow:0 0 0 5px rgba(31,191,91,.16)}
}

`;

  function replaceExactlyOnce(source, oldValue, newValue, label) {
    const first = source.indexOf(oldValue);
    const last = source.lastIndexOf(oldValue);
    if (first < 0 || first !== last) throw new Error('No se pudo actualizar: ' + label);
    return source.slice(0, first) + newValue + source.slice(first + oldValue.length);
  }

  function applyRequestedChanges(html) {
    html = replaceExactlyOnce(html, oldLockButton, newLockButton, 'control del recorte');
    html = replaceExactlyOnce(html, oldNotice, newNotice, 'avisos flotantes');
    html = replaceExactlyOnce(html, oldCropLock, newCropLock, 'estado del recorte');
    html = replaceExactlyOnce(html, oldExportState, newExportState, 'estado de audio exportado');
    html = replaceExactlyOnce(html, oldExportFps, newExportFps, 'frecuencia de exportación');
    html = replaceExactlyOnce(html, oldBitrate, newBitrate, 'bitrate de exportación');
    html = replaceExactlyOnce(html, oldAudioContext, newAudioContext, 'reloj de audio');
    html = replaceExactlyOnce(html, oldClearAudio, newClearAudio, 'limpieza de audio');
    html = replaceExactlyOnce(html, oldAudioRouting, newAudioRouting, 'sincronización de pistas');
    html = replaceExactlyOnce(html, oldSilenceCall, newSilenceCall, 'silencio de vista previa');
    html = replaceExactlyOnce(html, oldRecorderOptions, newRecorderOptions, 'codificación de audio');
    html = replaceExactlyOnce(html, oldRecorderStart, newRecorderStart, 'inicio sincronizado de la grabación');
    html = replaceExactlyOnce(html, oldRecorderPause, newRecorderPause, 'cambio entre recortes sin pausar MP4');
    html = replaceExactlyOnce(html, oldRecorderResume, newRecorderResume, 'reanudación MP4 innecesaria');
    html = replaceExactlyOnce(html, '@media (max-width:430px){', cssOverride + '@media (max-width:430px){', 'estilos');
    return html;
  }

  async function fetchBase() {
    let lastError;
    for (const source of BASE_SOURCES) {
      try {
        const response = await fetch(source, {cache:'no-cache'});
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return await response.text();
      } catch (error) {
        lastError = error;
      }
    }
    throw lastError || new Error('No se pudo cargar el editor.');
  }

  fetchBase()
    .then(applyRequestedChanges)
    .then(html => {
      document.open();
      document.write(html);
      document.close();
    })
    .catch(error => {
      console.error(error);
      document.querySelector('.boot-card').innerHTML = '<p>No se pudo abrir el editor. Recarga la página cuando tengas conexión.</p>';
    });
})();
</script>
</body>
</html>
