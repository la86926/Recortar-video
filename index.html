<title>Recorte — editor de video</title>
<style>
html,body{margin:0;min-height:100%;background:#F5F5F7;color:#1D1D1F;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.boot-card{max-width:360px;padding:24px;border-radius:22px;background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.08)}
.boot-dot{width:34px;height:34px;margin:0 auto 14px;border:4px solid rgba(31,191,91,.18);border-top-color:#1FBF5B;border-radius:50%;animation:spin .8s linear infinite}
.boot p{margin:0;color:#636366;font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-color-scheme:dark){html,body{background:#090A09;color:#F5F5F7}.boot-card{background:#1C1E1B}.boot p{color:#A1A1A6}}
</style>
</head>

          const raw=await source.file.arrayBuffer();
          const decoded=await bctx.decodeAudioData(raw);

          const gain=bctx.createGain(); gain.gain.value=1.1; gain.connect(dest);
          const node=bctx.createBufferSource(); node.buffer=decoded; node.connect(gain);
          const at=dest.stream.getAudioTracks()[0];

            S.exportBufferAudio={ctx:bctx,node,gain,clip,started:false};
            if(bctx.state==='suspended') await bctx.resume();

            try{ node.disconnect(); gain.disconnect(); bctx.close(); }catch(e){}

          try{ if(bctx&&bctx.state!=='closed') bctx.close(); }catch(err){}

          if(a.ctx.state==='suspended') await a.ctx.resume();
        }catch(e){ dest=null; }
      }
    }
  }`;

    const ready=()=>{
      if(settled) return;
      settled=true;
      if(timer) clearTimeout(timer);
      resolve();
    };
    rec.addEventListener('start',ready,{once:true});
    rec.start();
    timer=setTimeout(ready,400);
  });
  if(!S.exporting||!S.exportState) return;

  S.exportState.clipStartedAt=performance.now();

  if(!S.exportState.plan[0].reversed){
    if(S.exportBufferAudio){
      let resolved=false;
      const firstFrame=new Promise(resolve=>{
        const done=mediaTime=>{
          if(resolved) return;
          resolved=true;
          resolve(Number.isFinite(mediaTime)?mediaTime:v.currentTime);
        };
        if(typeof v.requestVideoFrameCallback==='function'){
          try{ v.requestVideoFrameCallback((now,meta)=>done(meta&&meta.mediaTime)); }
          catch(e){}
        }
        v.addEventListener('playing',()=>setTimeout(()=>done(v.currentTime),0),{once:true});
        setTimeout(()=>done(v.currentTime),300);
      });
      const playPromise=v.play().catch(()=>{});
      const mediaTime=await firstFrame;
      if(!S.exporting||!S.exportState) return;
      drawComposite(S.exportState.ctx,S.exportState.output.w,S.exportState.output.h);
      const b=S.exportBufferAudio, clip=b.clip;
      const offset=Math.min(clip.end,Math.max(clip.start,mediaTime));
      const duration=Math.max(.001,clip.end-offset);
      try{
        b.node.start(b.ctx.currentTime,offset,duration);
        b.started=true;
      }catch(e){}
      await playPromise;
    }else{
      await v.play().catch(()=>{});
    }
  }
  S.raf=requestAnimationFrame(exportTick);`;

`;

  let timer=0, holding=false;

}
bindFrameStepRepeat(els.stepBack,-1);

const SAVE_DB='recorte-proyecto';
let saveDbPromise=null, lastSavedState='', savedFileIds=new Set(), saveBusy=false, restoringProject=false, suppressFloatingHintOnce=false;
function openSaveDb(){
  if(saveDbPromise) return saveDbPromise;
  saveDbPromise=new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('Sin almacenamiento local')); return; }
    const request=indexedDB.open(SAVE_DB,1);
    request.onupgradeneeded=()=>{
      const db=request.result;
      if(!db.objectStoreNames.contains('files')) db.createObjectStore('files');
      if(!db.objectStoreNames.contains('state')) db.createObjectStore('state');
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  }).catch(error=>{ saveDbPromise=null; throw error; });
  return saveDbPromise;
}
function saveStore(store,mode,work){
  return openSaveDb().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(store,mode);
    const request=work(tx.objectStore(store));
    let result;
    if(request) request.onsuccess=()=>{ result=request.result; };
    tx.oncomplete=()=>resolve(result);
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error);
  }));
}

async function saveProjectNow(){

      if(savedFileIds.has(source.id)||!source.file) continue;
      await saveStore('files','readwrite',store=>store.put(source.file,source.id));
      savedFileIds.add(source.id);
    }
    const current=new Set(S.sources.map(source=>source.id));
    for(const id of [...savedFileIds]){
      if(current.has(id)) continue;

  function replaceExactlyOnce(source, oldValue, newValue, label) {
    const first = source.indexOf(oldValue);
    const last = source.lastIndexOf(oldValue);
    if (first < 0 || first !== last) throw new Error('No se pudo actualizar: ' + label);
    return source.slice(0, first) + newValue + source.slice(first + oldValue.length);
  }

    for (const source of BASE_SOURCES) {
