@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-color-scheme:dark){html,body{background:#090A09;color:#F5F5F7}.boot-card{background:#1C1E1B}.boot p{color:#A1A1A6}}
</style>

    }
  }
  S.raf=requestAnimationFrame(exportTick);`;

function previewNeedsAudioGraph(){
  return !!S.audio||S.clips.some(c=>(c.fadeAudioIn||0)>0||(c.fadeAudioOut||0)>0);
}
function playWhenReady(v){
  const token=S.pendingPlay=(S.pendingPlay||0)+1;

  const check=()=>{ if(!v.seeking&&v.readyState>=3) finish(); };

const SAVE_DB='recorte-proyecto';
let saveDbPromise=null, lastSavedState='', savedFileIds=new Set(), saveBusy=false, restoringProject=false, suppressFloatingHintOnce=false;
function openSaveDb(){
  if(saveDbPromise) return saveDbPromise;
  saveDbPromise=new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('Sin almacenamiento local')); return; }
    const request=indexedDB.open(SAVE_DB,1);
    request.onupgradeneeded=()=>{
      const db=request.result;
      if(!db.objectStoreNames.contains('files')) db.createObjectStore('files');
      if(!db.objectStoreNames.contains('state')) db.createObjectStore('state');
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  }).catch(error=>{ saveDbPromise=null; throw error; });
  return saveDbPromise;
}
function saveStore(store,mode,work){
  return openSaveDb().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(store,mode);
    const request=work(tx.objectStore(store));
    let result;
    if(request) request.onsuccess=()=>{ result=request.result; };
    tx.oncomplete=()=>resolve(result);
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error);
  }));
}
function projectStateForSave(){

async function saveProjectNow(force){
  if(saveBusy||restoringProject||S.exporting) return;
  if(force!==true&&(!els.video.paused||S.reversePlaying)) return;
  const state=projectStateForSave();
  if(!state) return;
  saveBusy=true;
  try{
    const fileItems=S.sources.map(source=>({id:source.id,file:source.file})).concat(window.RecorteImagenes?window.RecorteImagenes.files():[]);
    for(const item of fileItems){
      if(force===true) break;
      if(savedFileIds.has(item.id)||!item.file) continue;
      await saveStore('files','readwrite',store=>store.put(item.file,item.id));
      savedFileIds.add(item.id);
    }
    const current=new Set(fileItems.map(item=>item.id));
    for(const id of [...savedFileIds]){
      if(force===true) break;
      if(current.has(id)) continue;
      await saveStore('files','readwrite',store=>store.delete(id));
      savedFileIds.delete(id);
    }
    const json=JSON.stringify(state);
    if(json!==lastSavedState){
      await saveStore('state','readwrite',store=>store.put(json,'project'));
      lastSavedState=json;
    }

    console.warn('No se pudo guardar el proyecto en el dispositivo.',error);

  }

    const state=JSON.parse(json);

    for(const meta of state.sources){
      const file=await saveStore('files','readonly',store=>store.get(meta.id));
      if(!file) throw new Error('Falta un video guardado.');
      sources.push({...meta,file,url:URL.createObjectURL(file)});

    S.sources=sources;
    S.clips=state.clips;
    S.serial=Math.max(S.serial,state.serial||0);

      if(imagesApi) await imagesApi.importState(state.images,id=>saveStore('files','readonly',store=>store.get(id)));

    const located=locateProjectTime(state.time||0);

.transcript-close{flex:0 0 36px;width:36px;height:36px;display:grid;place-items:center;appearance:none;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--text);cursor:pointer;padding:0}
.transcript-close svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.transcript-status{padding:14px 20px 0}
.transcript-status[hidden]{display:none}
.transcript-msg{margin:0 0 8px;font-size:13.5px;color:var(--text-2)}
.transcript-bar{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.transcript-bar[hidden]{display:none}
.transcript-bar i{display:block;height:100%;width:0;background:var(--action);border-radius:inherit;transition:width .2s ease}
.transcript-text{
  flex:1;min-height:220px;margin:14px 20px 0;padding:12px 14px;resize:none;border:1px solid var(--line);border-radius:14px;
  background:var(--surface-2);color:var(--text);font:400 15.5px/1.55 var(--sans);-webkit-user-select:text;user-select:text
}
.transcript-foot{display:flex;justify-content:flex-end;padding:14px 20px 18px}
.transcript-foot .btn{min-width:120px}
/* Exportar audio | Exportar video */
#bar .inner > div:last-child{gap:10px !important}
/* Barra de herramientas: 9 botones; en el móvil, dos filas (5 + 4) */
@media(max-width:520px){ .editor-toolbar{grid-template-columns:repeat(5,1fr) !important} }
/* Línea de tiempo de imágenes */
.overlay-track{position:relative;height:34px;margin:0 0 6px;border-radius:11px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.overlay-track.hidden{display:none}
.overlay-content{position:relative;height:100%;min-width:100%;will-change:transform}
.overlay-seg{
  position:absolute;top:3px;bottom:3px;min-width:18px;border-radius:9px;overflow:hidden;
  background:#2A8CFF center/cover no-repeat;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55);
  touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none
}
.overlay-seg::before{content:"";position:absolute;inset:0;background:rgba(10,60,140,.45)}
.overlay-seg.selected{box-shadow:inset 0 0 0 2.5px #FFFFFF,0 0 0 2px rgba(42,140,255,.55)}
.overlay-seg .ov-handle{position:absolute;top:0;bottom:0;width:16px;z-index:2;cursor:ew-resize;display:flex;align-items:center;justify-content:center}
.overlay-seg .ov-handle::after{content:"";width:3px;height:14px;border-radius:2px;background:#FFFFFF;box-shadow:0 0 3px rgba(0,0,0,.4)}
.overlay-seg .ov-handle.l{left:0}
.overlay-seg .ov-handle.r{right:0}
.overlay-seg .ov-fade{position:absolute;top:0;bottom:0;z-index:1;pointer-events:none}
.overlay-seg .ov-fade.in{left:0;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,0))}
.overlay-seg .ov-fade.out{right:0;background:linear-gradient(270deg,rgba(0,0,0,.55),rgba(0,0,0,0))}
/* Visor en modo imagen */
.image-edit-canvas{position:absolute;inset:0;width:100%;height:100%;display:none;z-index:6;touch-action:none;border-radius:inherit}
.stage.image-mode .image-edit-canvas{display:block}
.stage.image-mode video,.stage.image-mode .shade,.stage.image-mode .badge{opacity:0 !important;pointer-events:none !important}
/* Sección "Imagen": acento azul para distinguirla de las funciones del video */
.image-card.hidden{display:none}
.image-card{border-color:rgba(42,140,255,.35);background:linear-gradient(180deg,rgba(42,140,255,.07),rgba(42,140,255,0) 70%),var(--surface)}
.image-card > h2::before{background:#2A8CFF !important}
.image-card > h2{color:#2A8CFF}
.image-card-body{display:flex;gap:14px;align-items:center}
.image-card-thumb{flex:0 0 64px;width:64px;height:64px;border-radius:0;background:#2A8CFF center/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:border-radius .1s}
.image-card-rows{flex:1;min-width:0;display:grid;gap:8px}
.image-row{display:grid;grid-template-columns:92px 1fr 50px;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--text-2)}
.image-row input[type=range]{width:100%;min-width:0;accent-color:#2A8CFF}
.image-row output{font:600 12.5px var(--mono);color:var(--text-3);text-align:right}
.image-card .image-delete{margin-top:14px;width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;color:#E23D3D;background:var(--surface-2);border:1px solid rgba(226,61,61,.22)}
.image-card .image-delete svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:430px){ .image-row{grid-template-columns:82px 1fr 44px;font-size:13px} .image-card-thumb{flex-basis:52px;width:52px;height:52px} }
/* Eliminar imagen dentro del visor */
.image-delete-pill{position:absolute;z-index:8;right:10px;bottom:10px;display:none;align-items:center;gap:6px;appearance:none;border:0;border-radius:999px;padding:8px 14px;background:#E23D3D;color:#FFFFFF;font:650 13.5px var(--sans);box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.image-delete-pill svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stage.image-mode .image-delete-pill{display:flex}
.stage.image-mode .image-edit-canvas{touch-action:pan-y}
/* Sección "Imagen" flotante */
.image-card > h2{position:relative}
.image-card-float{margin-left:10px;flex:0 0 32px;width:32px;height:32px;display:grid;place-items:center;appearance:none;border:1px solid rgba(42,140,255,.35);border-radius:10px;background:rgba(42,140,255,.10);color:#2A8CFF;cursor:pointer;padding:0}
.image-card-float svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.image-card-float .i-close{display:none}
.image-card.floating .image-card-float .i-float{display:none}
.image-card.floating .image-card-float .i-close{display:block}
.image-card.floating{position:fixed;z-index:44;margin:0;width:min(420px,calc(100vw - 20px));box-shadow:0 18px 50px rgba(0,0,0,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:linear-gradient(180deg,rgba(42,140,255,.10),rgba(42,140,255,.02)),var(--surface)}
.image-card.floating > h2{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
/* Versión */
.brand .app-version{
  align-self:center;padding:2px 7px;border:1px solid var(--line);border-radius:999px;
  font:650 10.5px var(--sans);letter-spacing:.02em;color:var(--text-3);white-space:nowrap
}
/* Vista flotante: la mitad de tamaño en el móvil */
@media(max-width:700px){
  .floating-preview{width:min(28vw,125px);padding:3px;border-radius:12px}
  .floating-preview canvas{border-radius:9px}
  .floating-close{top:4px;right:4px;width:20px;height:20px}
  .floating-close::before,.floating-close::after{width:9px;height:1.5px}
}
/* Aviso de la vista flotante: no recibe toques, no estorba al desplazarse */
.floating-hint{
  position:fixed;z-index:46;max-width:min(250px,calc(100vw - 20px));padding:10px 13px;
  border-radius:14px;background:rgba(28,28,30,.88);color:#FFFFFF;
  font:550 13px/1.35 var(--sans);box-shadow:0 10px 30px rgba(0,0,0,.22);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  pointer-events:none;opacity:0;transform:translateY(-4px);
  transition:opacity .18s ease,transform .18s ease
}
.floating-hint.show{opacity:1;transform:none}
@keyframes crop-lock-attention{
  0%,100%{box-shadow:0 0 0 0 rgba(31,191,91,.08)}
  50%{box-shadow:0 0 0 5px rgba(31,191,91,.16)}
}

`;

  function replaceExactlyOnce(source, oldValue, newValue, label) {
    const first = source.indexOf(oldValue);
    const last = source.lastIndexOf(oldValue);
    if (first < 0 || first !== last) throw new Error('No se pudo actualizar: ' + label);
    return source.slice(0, first) + newValue + source.slice(first + oldValue.length);
  }

  function applyRequestedChanges(html) {
    html = replaceExactlyOnce(html, oldLockButton, newLockButton, 'control del recorte');
    html = replaceExactlyOnce(html, oldNotice, newNotice, 'avisos flotantes');
    html = replaceExactlyOnce(html, oldCropLock, newCropLock, 'estado del recorte');
    html = replaceExactlyOnce(html, oldExportState, newExportState, 'estado de audio exportado');
    html = replaceExactlyOnce(html, oldExportFps, newExportFps, 'frecuencia de exportación');
    html = replaceExactlyOnce(html, oldBitrate, newBitrate, 'bitrate de exportación');
    html = replaceExactlyOnce(html, oldAudioContext, newAudioContext, 'reloj de audio');
    html = replaceExactlyOnce(html, oldClearAudio, newClearAudio, 'limpieza de audio');
    html = replaceExactlyOnce(html, oldAudioRouting, newAudioRouting, 'sincronización de pistas');
    html = replaceExactlyOnce(html, oldSilenceCall, newSilenceCall, 'silencio de vista previa');
    html = replaceExactlyOnce(html, oldRecorderOptions, newRecorderOptions, 'codificación de audio');
    html = replaceExactlyOnce(html, oldRecorderStart, newRecorderStart, 'inicio sincronizado de la grabación');
    html = replaceExactlyOnce(html, oldRecorderPause, newRecorderPause, 'cambio entre recortes sin pausar MP4');
    html = replaceExactlyOnce(html, oldRecorderResume, newRecorderResume, 'reanudación MP4 innecesaria');
    html = replaceExactlyOnce(html, oldExportGuard, newExportGuard, 'exportación cancelada antes de grabar');
    html = replaceExactlyOnce(html, oldTickDraw, newTickDraw, 'sin fotogramas fuera del recorte');
    html = replaceExactlyOnce(html, oldTickStatus, newTickStatus, 'aviso durante la exportación');
    html = replaceExactlyOnce(html, oldRecStop, newRecStop, 'detener exportación al salir de la pantalla');
    html = replaceExactlyOnce(html, oldCompositeEnd, newCompositeEnd, 'imágenes en el video');
    html = replaceExactlyOnce(html, oldExportButton, newExportButton, 'botones de exportar');
    html = html.split("textContent='Exportar proyecto'").join("textContent='Exportar video'");
    html = replaceExactlyOnce(html, oldPlayStartAudio, newPlayStartAudio, 'audio de la vista previa al reproducir');
    html = replaceExactlyOnce(html, oldPlayEventAudio, newPlayEventAudio, 'audio de la vista previa');
    html = replaceExactlyOnce(html, oldStartPlayback, newStartPlayback, 'reproducir cuando el video esté listo');
    html = replaceExactlyOnce(html, oldPlayCall, newPlayCall, 'inicio de reproducción');
    html = replaceExactlyOnce(html, oldSeekPause, newSeekPause, 'cancelar reproducción pendiente');
    html = replaceExactlyOnce(html, oldToggleStart, newToggleStart, 'botón reproducir');
    html = replaceExactlyOnce(html, oldPreviewCanvasSize, newPreviewCanvasSize, 'tamaño de la vista previa');
    html = replaceExactlyOnce(html, oldLivePreviews, newLivePreviews, 'dibujo de vistas previas');
    html = replaceExactlyOnce(html, oldMonitorGain, newMonitorGain, 'volumen de la vista previa');
    html = replaceExactlyOnce(html, oldStripLoop, newStripLoop, 'miniaturas sin interrumpir la reproducción');
    html = replaceExactlyOnce(html, oldInsertDialog, newInsertDialog, 'diálogo de nuevo proyecto');
    html = replaceExactlyOnce(html, oldScissors, newScissors, 'icono de tijeras');
    html = replaceExactlyOnce(html, oldStepButtons, newStepButtons, 'avance continuo de fotogramas');
    html = replaceExactlyOnce(html, oldFloatIcon, newFloatIcon, 'icono de la vista flotante');
    html = replaceExactlyOnce(html, oldBrandTitle, newBrandTitle, 'versión');
    html = replaceExactlyOnce(html, oldFloatMinWidth, newFloatMinWidth, 'tamaño mínimo de la vista flotante');
    html = replaceExactlyOnce(html, oldFloatShow, newFloatShow, 'aviso de la vista flotante');
    html = replaceExactlyOnce(html, oldCropLockClick, newCropLockClick, 'aceptar recorte');
    html = replaceExactlyOnce(html, oldLoadCrop, newLoadCrop, 'encuadre inicial');
    html = replaceExactlyOnce(html, oldFlipButtons, newFlipButtons, 'iconos de voltear');
    html = replaceExactlyOnce(html, oldAddVideoIcon, newAddVideoIcon, 'icono de añadir video');
    html = replaceExactlyOnce(html, oldNewProjectButton, newNewProjectButton, 'botón de nuevo proyecto');
    html = replaceExactlyOnce(html, oldNewProjectHandler, newNewProjectHandler, 'acción de nuevo proyecto');
    html = replaceExactlyOnce(html, oldToolbarColumns, newToolbarColumns, 'columnas de herramientas');
    html = replaceExactlyOnce(html, oldExportEntry, newExportEntry, 'exportación rápida');
    html = replaceExactlyOnce(html, oldCancel, newCancel, 'cancelar exportación rápida');
    html = replaceExactlyOnce(html, oldPickMime, newPickMime, 'formatos de respaldo');
    html = replaceExactlyOnce(html, oldRecType, newRecType, 'tipo de archivo de respaldo');
    html = replaceExactlyOnce(html, oldScriptEnd, newScriptEnd, 'conexión con el exportador rápido');
    html = replaceExactlyOnce(html, '@media (max-width:430px){', cssOverride + '@media (max-width:430px){', 'estilos');
    return html;
  }

  async function fetchBase() {
    let lastError;
    for (const source of BASE_SOURCES) {
      try {
        const response = await fetch(source, {cache:'no-cache'});
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return await response.text();
      } catch (error) {
        lastError = error;
      }
    }
    throw lastError || new Error('No se pudo cargar el editor.');
  }

  fetchBase()
    .then(applyRequestedChanges)
    .then(html => {
      document.open();
      document.write(html);
      document.close();
    })
    .catch(error => {
      console.error(error);
      document.querySelector('.boot-card').innerHTML = '<p>No se pudo abrir el editor. Recarga la página cuando tengas conexión.</p>';
    });
})();
</script>
